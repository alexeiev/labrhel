<VirtualHost *:80>
  ServerName content.example.com
  DocumentRoot /var/www/html/repos

  <Directory /var/www/html/repos>
    Options +Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex disabled
  </Directory>

  ErrorLog /var/log/httpd/repos_error.log
  CustomLog /var/log/httpd/repos_access.log combined
</VirtualHost>