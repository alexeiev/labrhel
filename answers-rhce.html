        function getLabel(label, lang) {
            if (typeof label === 'string') return label;
            return label[lang] || label['en'];
        }

        function render() {
            const lang = languageSelect.value;
            mainContentDiv.innerHTML = '';

            const header = document.createElement('div');
            header.className = 'page-header';
            const h1 = document.createElement('h1');
            h1.textContent = lang === 'pt' ? 'RHCE (EX294) - Respostas' : 'RHCE (EX294) - Answers';
            header.appendChild(h1);
            mainContentDiv.appendChild(header);

            answers.forEach(q => {
                const block = document.createElement('div');
                block.className = 'answer-block';

                const title = document.createElement('h2');
                title.textContent = getLabel(q.title, lang);
                block.appendChild(title);

                const enunciado = document.createElement('div');
                enunciado.className = 'enunciado';
                enunciado.textContent = getLabel(q.enunciado, lang);
                block.appendChild(enunciado);

                q.sections.forEach(section => {
                    const h3 = document.createElement('h3');
                    h3.textContent = getLabel(section.label, lang);
                    block.appendChild(h3);

                    const pre = document.createElement('pre');
                    pre.textContent = section.code;
                    block.appendChild(pre);
                });

                mainContentDiv.appendChild(block);
            });
        }

        const urlLang = new URLSearchParams(window.location.search).get('lang');
        if (urlLang && (urlLang === 'pt' || urlLang === 'en')) {
            languageSelect.value = urlLang;
        }

        languageSelect.addEventListener('change', render);
        render();
    </script>
